{% extends "registros_de_aprendizado/base.html" %}

{% block content %}
  <div class="card shadow-sm border-0 p-4">
    <p class="text-muted mb-1">
      Tópico: <a href="{% url 'registros_de_aprendizado:topico' topico.id %}">{{ topico.texto }}</a>
    </p>
    <h2 class="h4 fw-bold mb-3">Editar anotação</h2>

    <form action="{% url 'registros_de_aprendizado:edita_entrada' entrada.id %}" method="post">
      {% csrf_token %}
      <div class="mb-3">
        {{ form.as_p }}
      </div>
      <button name="submit" class="btn btn-primary">Salvar Alterações</button>
      <a href="{% url 'registros_de_aprendizado:topico' topico.id %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
{% endblock %}
