<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros de Aprendizado</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar/Menu Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'registros_de_aprendizado:index' %}">
                📚 Registros de Aprendizado
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'registros_de_aprendizado:index' %}">Início</a>
                <a class="nav-link" href="{% url 'registros_de_aprendizado:topicos' %}">Tópicos</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="text-center text-muted py-4 mt-5 border-top">
        <small>Registros de Aprendizado &copy; Django App</small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
